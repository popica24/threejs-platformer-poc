<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js - Proiect de invatare v2</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #e6eff7;
      }
      canvas {
        display: block;
      }
      /* NOU: interfata jocului */
      .hud { position: fixed; inset: 0; pointer-events: none; color: #24304a;
        font: 600 16px/1.3 system-ui, sans-serif; transition: opacity 0.2s; }
      .hud.dim { opacity: 0; }
      .stats { position: absolute; top: 16px; left: 16px; display: flex; gap: 16px; }
      .stats > div { background: #ffffffcc; padding: 6px 14px; border-radius: 8px; font-variant-numeric: tabular-nums; }
      .coins { color: #a87400; }
      .progress { position: absolute; top: 20px; left: 50%; width: min(36vw, 420px); height: 10px;
        transform: translateX(-50%); background: #ffffff99; border-radius: 5px; overflow: hidden; }
      .fill { width: 0; height: 100%; background: #ff7a3c; transition: width 0.3s; }
      .abilities { position: absolute; left: 16px; bottom: 16px; }
      .build { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); }
      .map { position: absolute; top: 16px; right: 16px; width: 150px; height: 150px;
        background: #ffffffaa; border-radius: 50%; }
      .toast { position: absolute; top: 18%; left: 50%; transform: translateX(-50%);
        background: #1f2a44e6; color: #fff; padding: 10px 20px; border-radius: 8px; opacity: 0; transition: opacity 0.25s; }
      .toast.show { opacity: 1; }
      .crosshair { display: none; position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
        margin: -3px 0 0 -3px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1.5px #24304acc; }
      .crosshair.show { display: block; }
      .menu { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        padding: 16px; background: #24304a66; font: 15px/1.45 system-ui, sans-serif; overflow: auto; }
      .menu.show { display: flex; }
      .panel { background: #f7fafd; color: #24304a; width: min(680px, 100%); padding: 24px 28px;
        border-radius: 12px; max-height: calc(100vh - 32px); overflow: auto; box-sizing: border-box; }
      .panel h1 { margin: 0 0 8px; font-size: 32px; }
      .panel h2 { margin: 16px 0 6px; font-size: 16px; }
      .panel p { margin: 0 0 10px; }
      .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
      .panel button { font: inherit; font-weight: 600; padding: 8px 14px; border: 1px solid #c5d0e0;
        border-radius: 8px; background: #fff; color: inherit; cursor: pointer; }
      .panel button:hover { background: #e8f0fa; }
      .panel button.active { background: #ff7a3c; border-color: #ff7a3c; color: #fff; }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <!-- Tot codul e in js/. main.js e punctul de intrare: el importa celelalte module.
         Importmap-ul de mai sus trebuie sa fie INAINTE de acest script, ca "three" sa fie gasit. -->
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
